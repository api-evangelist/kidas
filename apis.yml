name: Kidas
description: Kidas is a Techstars-backed trust-and-safety company that builds white-label
  scam detection and online-protection solutions for enterprises and consumers. Its
  ProtectMe platform monitors PC gaming and Discord voice and text channels for cyberbullying,
  predators, phishing, and scams, and its broader suite adds SMS scam detection, email
  protection, a scam-screening chatbot, and deepfake/impersonation defense that integrate
  into existing customer channels. Kidas markets custom builds and lists Aura, Comcast,
  Overwolf, Razer, Walmart, Intel, and Best Buy among its customers. No public developer
  API, OpenAPI, or SDK surface is published as of this profile.
